site_name: "Insegnare Informatica"
site_url: "https://informaticainclasse.it/"
site_description: "Un percorso per insegnare informatica nella scuola primaria."

theme:
  name: material
  language: it
  custom_dir: overrides
  font: false
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    primary: teal
    accent: deep orange

plugins:
  - search:
      lang: it
  - redirects:
      redirect_maps:
        'aladdinProposte.md': 'https://lonati.di.unimi.it/didainfo_2019-20/proposte_didattiche_aladdin.pdf'
