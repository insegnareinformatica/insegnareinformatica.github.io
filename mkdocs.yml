markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/site.css

hooks:
  - hooks/book_downloads.py

extra:
  generator: false
  home_counter_url: !ENV [HOME_COUNTER_URL, ""]
  book_pending_message: "disponibile entro il 5 ottobre 2026"

copyright: "Insegnare Informatica"

nav:
  - Home: index.md
  - Contenuti: contenuti.md
