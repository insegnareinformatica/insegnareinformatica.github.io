site_name: "Insegnare Informatica"
site_url: "https://informaticainclasse.it/"
site_description: "Un percorso per insegnare informatica nella scuola primaria."

theme:
  name: material
  language: it
  custom_dir: overrides
  font: false
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    primary: teal
    accent: deep orange

plugins:
  - search:
      lang: it

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/site.css

hooks:
  - hooks/book_downloads.py

extra:
  generator: false
  home_counter_url: !ENV [HOME_COUNTER_URL, ""]

copyright: "Insegnare Informatica"

nav:
  - Home: index.md
  - Contenuti: contenuti.md
  - Risorse: risorse.md
  - Contatti: contatti.md
