name: Check site and publication helpers

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: php -l server/home-counter/counter.php
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/home-counter.test.cjs
      - run: mkdocs build --strict
      - run: python scripts/check_site.py
