name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect public book versions and download counts
        env:
          GH_TOKEN: ${{ github.token }}
          BOOK_PUBLICATION_ENABLED: ${{ vars.BOOK_PUBLICATION_ENABLED }}
        run: python scripts/book.py catalog

      - name: Build site
        env:
          HOME_COUNTER_URL: ${{ vars.HOME_COUNTER_URL }}
        run: mkdocs build --strict

      - name: Check published files
        run: python scripts/check_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
